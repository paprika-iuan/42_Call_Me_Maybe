[project]
name = "call-me-maybe"
version = "0.1.0"
description = "A function calling tool"
requires-python = ">=3.10"
dependencies = [
	"pydantic>=2.0",
	"numpy",
	"llm_sdk",
	"flake8>=7.0.0",
	"mypy>=1.0.0",
	"torch"
]

[tool.uv.sources]
llm_sdk = { path = "llm_sdk" }

[tool.mypy]
mypy_path = "."
explicit_package_bases = true